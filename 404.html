<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ethan Parker Wong</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages is a static file host with no server-side rewrites, so a
      // direct visit or refresh on a client-routed path (e.g. /experience,
      // /side-quests/travel) 404s — there's no real file at that path. GitHub
      // serves this 404.html for any missing path, so it re-encodes the
      // intended path into a query string and redirects to the real
      // index.html, which decodes it back (see the script in index.html)
      // before React Router mounts.
      //
      // This is a user/organization page (ethanwongca.github.io), served
      // from the domain root rather than a /repo-name/ subpath, so no path
      // segments need to be preserved.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
